name: Athkar Bot

# One run lasts ~5.5 hours and posts everything due in that window.
# When it ends it starts the next run itself; the schedule below is a backup
# in case GitHub delays or drops a run.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: athkar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_STATE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "athkar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Live. Set the repository variable DRY_RUN to "true" to pause posting.
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          BOT_GIT_CHECKPOINT: "true"
          PYTHONUNBUFFERED: "1"
        run: python -m athkar.bot

      - name: Save state
        if: always()
        run: |
          git add -- state.json 2>/dev/null || exit 0
          git diff --cached --quiet -- state.json || git commit -m "Update bot state [skip ci]"
          for i in 1 2 3; do
            git push origin "HEAD:${BOT_STATE_BRANCH}" && exit 0
            git pull --rebase origin "${BOT_STATE_BRANCH}"; sleep 2
          done
          exit 1

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${BOT_STATE_BRANCH}" -R "${{ github.repository }}"
