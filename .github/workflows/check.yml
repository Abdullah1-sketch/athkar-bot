name: Pre-launch check

# Builds data/verses.json from the Tanzil Quran text and writes
# reports/check.md (prayer times, white days, all texts, schedule).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/build_verses.py
      - run: python tools/check.py
      - name: Commit results
        run: |
          git config user.name "athkar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verses.json reports/check.md
          git diff --cached --quiet || git commit -m "Pre-launch check results [skip ci]"
          git push
